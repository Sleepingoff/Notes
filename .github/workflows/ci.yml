name: 검사 및 데스크톱 빌드
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci --no-audit --no-fund
      - run: python -B -m unittest discover -s tests -q
      - run: npm test
      - run: python tools/build_backend.py
      - name: Python 번들 검사
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            desktop-resources/backend/notes-backend.exe self-test
          else
            desktop-resources/backend/notes-backend self-test
          fi
      - run: npm run build:dir -- --${{ matrix.arch }}
      - name: 실제 앱 시작 검사
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python tools/smoke_desktop.py release/win-unpacked/Notes.exe
          elif [[ '${{ matrix.arch }}' == 'arm64' ]]; then
            python tools/smoke_desktop.py release/mac-arm64/Notes.app/Contents/MacOS/Notes
          else
            python tools/smoke_desktop.py release/mac/Notes.app/Contents/MacOS/Notes
          fi
